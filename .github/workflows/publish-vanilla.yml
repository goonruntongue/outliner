name: Publish Vanilla edition to npm
on:
  push:
    tags:
      - "vanilla-v*"
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vanilla
    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure the tag matches package.json
        run: test "vanilla-v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - name: Verify the package contents
        run: npm pack --dry-run
      - name: Publish to npm
        run: npm publish --provenance --access public
